spring.application.name=clinical-service
server.port=${PORT:8080}

# Local development defaults; on the VM set DB_* and JWT_PUBLIC_KEY_PATH as environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicalfield_clinical}
spring.datasource.username=${DB_USER:medicalfield}
spring.datasource.password=${DB_PASSWORD:medicalfield_dev}

# Flyway owns the schema; Hibernate only reads and writes rows.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Public key of the identity service, used to verify JWTs (RS256).
medicalfield.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:../keys/jwt-public.pem}
medicalfield.jwt.issuer=medicalfield-identity

# Conflict resolution used by sync: last-write-wins or server-wins.
medicalfield.sync.conflict-strategy=${SYNC_CONFLICT_STRATEGY:last-write-wins}
